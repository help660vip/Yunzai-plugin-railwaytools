name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 --title "v1.0.0" --notes-file .github/release-v1.0.0.md
          else
            gh release create v1.0.0 --verify-tag --title "v1.0.0" --notes-file .github/release-v1.0.0.md
          fi
